name: Release to CurseForge and Modrinth

on:
  workflow_run:
    workflows: ["Gradle Publish to Maven"]
    types:
      - completed

jobs:
  check-version:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.gate.outputs.is_release }}
    steps:
      - uses: actions/checkout@v6
      - id: gate
        run: |
          VERSION=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | xargs)
          if [[ "$VERSION" != *"-SNAPSHOT"* ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "Proceeding with release for version: $VERSION"
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "Snapshot detected ($VERSION). Skipping release."
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.is_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: adopt
          java-version: 21
          cache: gradle

      - name: Configure Gradle secrets
        run: |
          mkdir -p ~/.gradle/
          echo "GRADLE_USER_HOME=${HOME}/.gradle" >> $GITHUB_ENV
          echo "${{ secrets.REPO_LOGIN }}" > ~/.gradle/gradle.properties
          echo "curseforge_token=${{ secrets.CURSEFORGE_TOKEN }}" >> ~/.gradle/gradle.properties
          echo "modrinth_token=${{ secrets.MODRINTH_TOKEN }}" >> ~/.gradle/gradle.properties

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Publish Fabric
        run: ./gradlew :fabric:publishMod

      - name: Publish Forge
        run: ./gradlew :forge:publishMod

      - name: Publish NeoForge
        run: ./gradlew :neoforge:publishMod